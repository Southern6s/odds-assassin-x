name: Collect Kalshi research data

on:
  workflow_dispatch:
    inputs:
      min_ts:
        description: "Start of trade window (Unix seconds, inclusive)"
        required: true
        type: string
      max_ts:
        description: "End of trade window (Unix seconds, exclusive)"
        required: true
        type: string
      max_pages_per_tier:
        description: "Market-page cap per live/archive tier (blank = all pages)"
        required: false
        default: "5"
        type: string
      max_trade_pages_per_tier:
        description: "Trade-page cap per live/archive tier (prevents oversized research artifacts)"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: kalshi-research-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate requested time window
        shell: bash
        env:
          MIN_TS: ${{ inputs.min_ts }}
          MAX_TS: ${{ inputs.max_ts }}
          MAX_PAGES: ${{ inputs.max_pages_per_tier }}
          MAX_TRADE_PAGES: ${{ inputs.max_trade_pages_per_tier }}
        run: |
          set -euo pipefail
          [[ "$MIN_TS" =~ ^[0-9]{1,12}$ ]] || { echo "min_ts must be Unix seconds"; exit 1; }
          [[ "$MAX_TS" =~ ^[0-9]{1,12}$ ]] || { echo "max_ts must be Unix seconds"; exit 1; }
          (( MAX_TS > MIN_TS )) || { echo "max_ts must be greater than min_ts"; exit 1; }
          [[ "$MAX_TRADE_PAGES" =~ ^[0-9]{1,4}$ ]] || { echo "max_trade_pages_per_tier must be a positive integer"; exit 1; }
          (( MAX_TRADE_PAGES >= 1 && MAX_TRADE_PAGES <= 1000 )) || { echo "max_trade_pages_per_tier must be between 1 and 1000"; exit 1; }
          if [[ -n "$MAX_PAGES" ]]; then
            [[ "$MAX_PAGES" =~ ^[0-9]{1,4}$ ]] || { echo "max_pages_per_tier must be a positive integer"; exit 1; }
            (( MAX_PAGES >= 1 && MAX_PAGES <= 1000 )) || { echo "max_pages_per_tier must be between 1 and 1000"; exit 1; }
          fi
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect market snapshots
        shell: bash
        env:
          MAX_PAGES: ${{ inputs.max_pages_per_tier }}
        run: |
          set -euo pipefail
          mkdir -p data
          if [[ -n "$MAX_PAGES" ]]; then
            python -m engine.collector --output data/market_snapshots.jsonl --max-pages-per-tier "$MAX_PAGES"
          else
            python -m engine.collector --output data/market_snapshots.jsonl
          fi
      - name: Collect bounded public trades
        run: >-
          python -m engine.trade_collector
          --min-ts "${{ inputs.min_ts }}"
          --max-ts "${{ inputs.max_ts }}"
          --max-pages-per-tier "${{ inputs.max_trade_pages_per_tier }}"
          --output data/trade_snapshots.jsonl
      - name: Upload research data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-research-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
