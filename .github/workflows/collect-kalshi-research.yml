name: Collect Kalshi research data

on:
  workflow_dispatch:
    inputs:
      min_ts:
        description: "Optional start timestamp; blank defaults to 32 days before max_ts"
        required: false
        default: ""
        type: string
      max_ts:
        description: "Optional end timestamp; blank defaults to current UTC time"
        required: false
        default: ""
        type: string
      max_trade_pages_per_tier:
        description: "Trade-page cap per live/archive tier (prevents oversized research artifacts)"
        required: true
        default: "2"
        type: string
      max_catalog_pages_per_tier:
        description: "Catalog pages per live/archive tier to inspect for resolved markets"
        required: true
        default: "10"
        type: string
      max_catalog_markets:
        description: "Maximum evenly distributed resolved catalog markets to add"
        required: true
        default: "200"
        type: string

permissions:
  contents: read

concurrency:
  group: kalshi-research-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Validate requested time window and page budgets
        id: window
        shell: bash
        env:
          MIN_TS_INPUT: ${{ steps.window.outputs.min_ts }}
          MAX_TS_INPUT: ${{ steps.window.outputs.max_ts }}
          MAX_TRADE_PAGES: ${{ inputs.max_trade_pages_per_tier }}
          MAX_CATALOG_PAGES: ${{ inputs.max_catalog_pages_per_tier }}
          MAX_CATALOG_MARKETS: ${{ inputs.max_catalog_markets }}
        run: |
          set -euo pipefail
          MAX_TS="$MAX_TS_INPUT"
          MIN_TS="$MIN_TS_INPUT"
          [[ -n "$MAX_TS" ]] || MAX_TS="$(date -u +%s)"
          [[ "$MAX_TS" =~ ^[0-9]{1,12}$ ]] || { echo "max_ts must be Unix seconds"; exit 1; }
          [[ -n "$MIN_TS" ]] || MIN_TS="$((MAX_TS - 32 * 24 * 60 * 60))"
          [[ "$MIN_TS" =~ ^[0-9]{1,12}$ ]] || { echo "min_ts must be Unix seconds"; exit 1; }
          (( MAX_TS > MIN_TS )) || { echo "max_ts must be greater than min_ts"; exit 1; }
          (( MAX_TS - MIN_TS <= 45 * 24 * 60 * 60 )) || { echo "Collection window is capped at 45 days; leave timestamps blank for the default 32-day window"; exit 1; }
          echo "min_ts=$MIN_TS" >> "$GITHUB_OUTPUT"
          echo "max_ts=$MAX_TS" >> "$GITHUB_OUTPUT"
          [[ "$MAX_TRADE_PAGES" =~ ^[0-9]{1,4}$ ]] || { echo "max_trade_pages_per_tier must be a positive integer"; exit 1; }
          (( MAX_TRADE_PAGES >= 1 && MAX_TRADE_PAGES <= 20 )) || { echo "max_trade_pages_per_tier must be between 1 and 20"; exit 1; }
          [[ "$MAX_CATALOG_PAGES" =~ ^[0-9]{1,2}$ ]] || { echo "max_catalog_pages_per_tier must be a positive integer"; exit 1; }
          (( MAX_CATALOG_PAGES >= 1 && MAX_CATALOG_PAGES <= 10 )) || { echo "max_catalog_pages_per_tier must be between 1 and 10"; exit 1; }
          [[ "$MAX_CATALOG_MARKETS" =~ ^[0-9]{1,4}$ ]] || { echo "max_catalog_markets must be a positive integer"; exit 1; }
          (( MAX_CATALOG_MARKETS >= 1 && MAX_CATALOG_MARKETS <= 1000 )) || { echo "max_catalog_markets must be between 1 and 1000"; exit 1; }
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect bounded public trades
        run: >-
          python -m engine.trade_collector
          --min-ts "${{ steps.window.outputs.min_ts }}"
          --max-ts "${{ steps.window.outputs.max_ts }}"
          --max-pages-per-tier "${{ inputs.max_trade_pages_per_tier }}"
          --output data/trade_snapshots.jsonl
      - name: Hydrate metadata for traded markets
        run: >-
          python -m engine.trade_market_hydrator
          --trades data/trade_snapshots.jsonl
          --output data/trade_market_snapshots.jsonl
      - name: Restore resumable catalog discovery checkpoint
        uses: actions/cache@v4
        with:
          path: |
            data/catalog_market_snapshots.jsonl
            data/catalog_market_state.json
          key: kalshi-catalog-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            kalshi-catalog-${{ github.ref_name }}-
      - name: Discover expanded live and historical market catalog
        run: >-
          python -m engine.catalog_discovery
          --max-pages-per-tier "${{ inputs.max_catalog_pages_per_tier }}"
          --output data/catalog_market_snapshots.jsonl
          --state-file data/catalog_market_state.json
      - name: Add resolved ordinary binary markets from requested settlement window
        run: >-
          python -m engine.research_market_union
          --hydrated data/trade_market_snapshots.jsonl
          --catalog data/catalog_market_snapshots.jsonl
          --min-ts "${{ steps.window.outputs.min_ts }}"
          --max-ts "${{ steps.window.outputs.max_ts }}"
          --max-catalog-markets "${{ inputs.max_catalog_markets }}"
          --output data/market_snapshots.jsonl
      - name: Collect bounded historical trades for research markets
        run: >-
          python -m engine.market_trade_collector
          --markets data/market_snapshots.jsonl
          --min-ts "${{ steps.window.outputs.min_ts }}"
          --max-ts "${{ steps.window.outputs.max_ts }}"
          --max-pages-per-tier "${{ inputs.max_trade_pages_per_tier }}"
          --output data/trade_snapshots.jsonl
      - name: Collect historical one-minute candles for research markets
        run: >-
          python -m engine.candlestick_collector
          --markets data/market_snapshots.jsonl
          --start-ts "${{ steps.window.outputs.min_ts }}"
          --end-ts "${{ steps.window.outputs.max_ts }}"
          --period-interval 1
          --output data/candlestick_snapshots.jsonl
      - name: Build ordinary binary research subset
        run: >-
          python -m engine.filter_research_universe
          --markets data/market_snapshots.jsonl
          --trades data/trade_snapshots.jsonl
          --candlesticks data/candlestick_snapshots.jsonl
          --output-dir data/ordinary_binary
      - name: Write collection manifest
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          names = [
              "trade_snapshots.jsonl", "trade_market_snapshots.jsonl",
              "catalog_market_snapshots.jsonl", "market_snapshots.jsonl",
              "candlestick_snapshots.jsonl",
              "ordinary_binary/market_snapshots.jsonl",
              "ordinary_binary/trade_snapshots.jsonl",
              "ordinary_binary/candlestick_snapshots.jsonl",
          ]
          manifest = {
              "workflow": "kalshi-research-expanded",
              "min_ts": os.environ.get("MIN_TS"),
              "max_ts": os.environ.get("MAX_TS"),
              "files": {
                  name: {"exists": Path("data", name).exists(),
                         "bytes": Path("data", name).stat().st_size if Path("data", name).exists() else 0}
                  for name in names
              },
              "paper_only": True,
              "live_trading": False,
          }
          Path("data").mkdir(parents=True, exist_ok=True)
          Path("data/collection_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
        env:
          MIN_TS: ${{ steps.window.outputs.min_ts }}
          MAX_TS: ${{ steps.window.outputs.max_ts }}
      - name: Upload research data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-expanded-research-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
