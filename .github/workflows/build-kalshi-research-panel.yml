name: Build Kalshi chronological research panel

on:
  workflow_run:
    workflows: ["Collect Kalshi research data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Collection run ID with an uploaded expanded-research artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: kalshi-research-panel-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  build-panel:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download expanded collection artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "kalshi-expanded-research-$SOURCE_RUN_ID" --dir source-data
          test -s source-data/market_snapshots.jsonl
          test -s source-data/trade_snapshots.jsonl
          test -s source-data/candlestick_snapshots.jsonl
      - name: Build ordinary-binary research subset
        run: |
          set -euo pipefail
          python -m engine.filter_research_universe \
            --markets source-data/market_snapshots.jsonl \
            --trades source-data/trade_snapshots.jsonl \
            --candlesticks source-data/candlestick_snapshots.jsonl \
            --output-dir source-data/ordinary_binary
          test -s source-data/ordinary_binary/market_snapshots.jsonl
          test -s source-data/ordinary_binary/trade_snapshots.jsonl
          test -s source-data/ordinary_binary/candlestick_snapshots.jsonl
      - name: Build leakage-safe hourly panel and validate it
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("source-data/ordinary_binary/candlestick_snapshots.jsonl")
          first_stamp = None
          last_stamp = None
          with path.open() as stream:
              for line in stream:
                  item = json.loads(line)
                  candle = item.get("candle", item)
                  stamp = candle.get("end_period_ts")
                  if isinstance(stamp, int) and not isinstance(stamp, bool) and stamp > 0:
                      first_stamp = stamp if first_stamp is None else min(first_stamp, stamp)
                      last_stamp = stamp if last_stamp is None else max(last_stamp, stamp)
          if first_stamp is None or last_stamp is None:
              raise SystemExit("No valid candle timestamps in ordinary-binary artifact")

          # Use the most recent 1,000 complete UTC-hour cutoffs supported by the data.
          first_hour = ((first_stamp + 3599) // 3600) * 3600
          last_hour = (last_stamp // 3600) * 3600
          if last_hour < first_hour:
              raise SystemExit("Candle window does not span a complete hourly cutoff")
          # Build a recent 7-day panel; retain a 24-hour feature lookback.
          first_hour = max(first_hour, last_hour - 167 * 3600)
          start = datetime.fromtimestamp(first_hour, timezone.utc).isoformat()
          end = datetime.fromtimestamp(last_hour, timezone.utc).isoformat()
          print(json.dumps({"forecast_start": start, "forecast_end": end,
                            "hourly_cutoffs": (last_hour-first_hour)//3600+1}, indent=2))
          with open("panel-window.env", "w") as output:
              output.write(f"FORECAST_START={start}\nFORECAST_END={end}\n")
          PY
          set -a
          source panel-window.env
          set +a
          # Stream-slice large source files before the panel builder loads them.
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          start = datetime.fromisoformat(os.environ["FORECAST_START"])
          end = datetime.fromisoformat(os.environ["FORECAST_END"])
          trade_start = start - timedelta(hours=24)
          candle_start_ts = int(start.timestamp()) - 300
          end_ts = int(end.timestamp())
          base = Path("source-data/ordinary_binary")
          specs = [
              ("trade_snapshots.jsonl", "panel_trade_snapshots.jsonl", "trade"),
              ("candlestick_snapshots.jsonl", "panel_candlestick_snapshots.jsonl", "candle"),
          ]
          for source_name, output_name, kind in specs:
              source, output = base / source_name, base / output_name
              kept = total = 0
              with source.open(encoding="utf-8") as inp, output.open("w", encoding="utf-8") as out:
                  for line in inp:
                      if not line.strip():
                          continue
                      total += 1
                      row = json.loads(line)
                      payload = row.get(kind, row)
                      if kind == "trade":
                          stamp = payload.get("created_time")
                          if not isinstance(stamp, str):
                              continue
                          when = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                          if when.tzinfo is None or not trade_start <= when.astimezone(timezone.utc) <= end:
                              continue
                      else:
                          stamp = payload.get("end_period_ts")
                          if isinstance(stamp, bool) or not isinstance(stamp, int):
                              continue
                          if not candle_start_ts <= stamp <= end_ts:
                              continue
                      out.write(json.dumps(row, separators=(",", ":"), allow_nan=False) + "\n")
                      kept += 1
              print(json.dumps({"input": source_name, "records": total, "retained": kept}))
          PY
          python -m engine.research_panel \
            --markets source-data/ordinary_binary/market_snapshots.jsonl \
            --trades source-data/ordinary_binary/panel_trade_snapshots.jsonl \
            --candlesticks source-data/ordinary_binary/panel_candlestick_snapshots.jsonl \
            --forecast-start "$FORECAST_START" \
            --forecast-end "$FORECAST_END" \
            --step-seconds 3600 \
            --max-cutoffs 1000 \
            --output data/research_panel.jsonl
          python - <<'PY'
          import json
          import math
          from collections import Counter
          from pathlib import Path

          panel = Path("data/research_panel.jsonl")
          rows = [json.loads(line) for line in panel.open()] if panel.exists() else []
          keys = [(r.get("forecast_at"), r.get("market_ticker")) for r in rows]
          if len(keys) != len(set(keys)):
              raise SystemExit("Duplicate market/cutoff rows detected")
          for row in rows:
              if not row.get("forecast_at") or not row.get("resolved_at"):
                  raise SystemExit("Panel row missing forecast_at or resolved_at")
              if row["resolved_at"] <= row["forecast_at"]:
                  raise SystemExit("Outcome is not strictly after its forecast cutoff")

          quoted = []
          for row in rows:
              mid = row.get("market_yes_mid")
              bid, ask = row.get("market_yes_bid"), row.get("market_yes_ask")
              age = row.get("quote_age_seconds")
              if (isinstance(mid, (int, float)) and math.isfinite(mid)
                      and 0 <= mid <= 1
                      and isinstance(bid, (int, float)) and isinstance(ask, (int, float))
                      and 0 <= bid <= ask <= 1
                      and isinstance(age, (int, float)) and 0 <= age <= 300):
                  quoted.append(row)

          def midpoint_metrics(observations):
              if not observations:
                  return None
              brier = sum((r["market_yes_mid"] - r["probability_label_yes"]) ** 2
                          for r in observations) / len(observations)
              accuracy = sum((r["market_yes_mid"] >= 0.5) == bool(r["probability_label_yes"])
                             for r in observations) / len(observations)
              return {"observations": len(observations),
                      "brier_score": round(brier, 6),
                      "directional_accuracy": round(accuracy, 6),
                      "neutral_50pct_brier": 0.25}

          first_quote_by_market = {}
          for row in sorted(quoted, key=lambda r: r["forecast_at"]):
              first_quote_by_market.setdefault(row["market_ticker"], row)
          settlement_markets_by_date = {
              (r["market_ticker"], r["resolved_at"][:10]) for r in rows
          }
          settlement_date_counts = Counter(date for _, date in settlement_markets_by_date)
          summary = {
              "rows": len(rows),
              "unique_markets": len({r["market_ticker"] for r in rows}),
              "unique_events": len({r.get("event_ticker") for r in rows if r.get("event_ticker")}),
              "cutoffs": len({r["forecast_at"] for r in rows}),
              "forecast_range": ([min(r["forecast_at"] for r in rows),
                                 max(r["forecast_at"] for r in rows)] if rows else None),
              "settlement_date_market_counts": dict(sorted(settlement_date_counts.items())),
              "labels": dict(Counter(str(r.get("probability_label_yes")) for r in rows)),
              "quote_coverage": {
                  "rows_with_valid_yes_midpoint": len(quoted),
                  "row_coverage_fraction": round(len(quoted) / len(rows), 6) if rows else 0,
                  "unique_markets_with_quotes": len(first_quote_by_market),
                  "repeated_observation_midpoint": midpoint_metrics(quoted),
                  "earliest_quoted_observation_per_market_midpoint": midpoint_metrics(
                      list(first_quote_by_market.values())
                  ),
              },
              "duplicate_market_cutoff_rows": 0,
              "strictly_future_settlements": True,
              "midpoint_metrics_are_descriptive_not_independent": True,
              "paper_only": True,
              "live_trading": False,
          }
          Path("data/research_panel_summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
      - name: Upload chronological panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-research-panel-${{ github.event.workflow_run.id || inputs.source_run_id }}
          path: data/research_panel*
          if-no-files-found: error
          retention-days: 14
