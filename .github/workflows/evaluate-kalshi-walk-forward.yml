name: Evaluate Kalshi panel walk-forward

on:
  workflow_dispatch:
    inputs:
      panel_build_run_id:
        description: "GitHub Actions run ID that built the panel artifact"
        required: true
        type: string
        default: "45771821686"
      source_run_id:
        description: "Original collection run ID used in the panel artifact name"
        required: true
        type: string
        default: "45978066420"
      depth_run_id:
        description: "Completed order-book depth collection run ID"
        required: true
        type: string
        default: "45983704283"

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download completed panel artifact
        uses: actions/download-artifact@v4
        with:
          name: kalshi-research-panel-${{ inputs.source_run_id }}
          path: panel-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.panel_build_run_id }}
      - name: Download timestamped depth artifact
        uses: actions/download-artifact@v4
        with:
          name: kalshi-orderbook-depth-${{ inputs.depth_run_id }}
          path: depth-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.depth_run_id }}
      - name: Verify panel and depth files
        run: test -s panel-artifact/research_panel.jsonl
      - name: Run leakage-safe walk-forward evaluation
        run: |
          set -euo pipefail
          python -m engine.walk_forward --dataset panel-artifact/research_panel.jsonl --features trade_count,contract_volume,block_contract_volume,yes_vwap,no_vwap,market_count,yes_bid_contracts,yes_ask_contracts,no_bid_contracts,no_ask_contracts --min-train-size 30 --test-cutoffs 1 --step-cutoffs 1 > walk-forward-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from engine.depth_join import attach_depth_snapshots
          from engine.paper_execution import simulate_paper_execution

          report = json.loads(Path("walk-forward-report.json").read_text())
          with Path("depth-artifact/orderbook_snapshots.jsonl").open() as handle:
              depth_rows = [json.loads(line) for line in handle if line.strip()]
          report["prediction_rows"] = attach_depth_snapshots(
              report["prediction_rows"], depth_rows, max_age_seconds=300
          )
          Path("walk-forward-report.json").write_text(
              json.dumps(report, indent=2) + chr(10)
          )
          matched_depth = sum(
              row["depth_snapshot_matched"] for row in report["prediction_rows"]
          )
          execution = simulate_paper_execution(report["prediction_rows"])
          Path("paper-execution-report.json").write_text(
              json.dumps(execution, indent=2) + chr(10)
          )
          aggregate = report["aggregate"]
          model = aggregate["model_brier"]
          neutral = aggregate["neutral_brier"]
          matched_model = aggregate["model_market_matched_brier"]
          midpoint = aggregate["market_midpoint_brier"]
          if model is None or neutral is None:
              raise SystemExit("Evaluation did not produce model and neutral Brier scores")
          if (matched_model is None) != (midpoint is None):
              raise SystemExit("Matched model and market benchmark availability differs")
          if matched_model and matched_model["observations"] != midpoint["observations"]:
              raise SystemExit("Matched model and market benchmark counts differ")
          summary = {
              "folds": len(report["folds"]),
              "model_brier_full_sample": model,
              "neutral_brier_full_sample": neutral,
              "model_brier_market_matched": matched_model,
              "market_midpoint_brier": midpoint,
              "model_brier_skill_vs_neutral_full_sample": (
                  1 - model["brier"] / neutral["brier"] if neutral["brier"] else None
              ),
              "model_brier_skill_vs_market_midpoint_matched_sample": (
                  1 - matched_model["brier"] / midpoint["brier"]
                  if matched_model and midpoint and midpoint["brier"] else None
              ),
              "diagnostics": report.get("diagnostics", {}),
              "prediction_rows": len(report.get("prediction_rows", [])),
              "depth_snapshots_available": len(depth_rows),
              "depth_matched_predictions": matched_depth,
              "depth_unmatched_predictions": len(report["prediction_rows"]) - matched_depth,
              "depth_max_age_seconds": 300,
              "paper_only": True,
              "live_trading": False,
              "execution_simulated": True,
              "paper_execution": {
                  "entry_count": execution["entry_count"],
                  "exit_count": execution["exit_count"],
                  "realized_net_pnl": execution["realized_net_pnl"],
                  "unrealized_net_pnl_estimate": execution["unrealized_net_pnl_estimate"],
                  "combined_net_pnl_estimate": execution["combined_net_pnl_estimate"],
                  "open_positions": execution["open_positions"],
                  "blocked_signal_counts": execution["blocked_signal_counts"],
                  "requires_displayed_depth": execution["requires_displayed_depth"],
                  "fills_are_estimates": execution["fills_are_estimates"],
              },
              "interpretation": (
                  "Chronological out-of-sample diagnostics only. Repeated hourly "
                  "observations are not independent; no live-trading claim."
              ),
          }
          Path("walk-forward-summary.json").write_text(json.dumps(summary, indent=2) + chr(10))
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload walk-forward report
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-walk-forward-evaluation
          path: |
            walk-forward-report.json
            walk-forward-summary.json
            paper-execution-report.json
          if-no-files-found: error
          retention-days: 30
